global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'local'
    service: 'inbridge'

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # ── Go Backend ──────────────────────────────────────────────────────────────
  - job_name: 'inbridge-go-api'
    static_configs:
      - targets: ['inbridge-api:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ── Next.js chat plane ──────────────────────────────────────────────────────
  # Deliberately NOT scraped. The chat plane runs per-request and is ephemeral on
  # Vercel, so in-process counters there would reset on every cold start. It
  # instead pushes LLM/RAG events to the Go API's /internal/telemetry/llm, and
  # those land in the inbridge-go-api job above. Watch the
  # inbridge_telemetry_events_total series to confirm the chat plane is still
  # reporting: if it flatlines while HTTP traffic continues, the LLM and RAG
  # panels are stale rather than healthy.

  # ── Python AI Service ───────────────────────────────────────────────────────
  # The AI FastAPI service currently exposes only /health.
  # When prometheus-fastapi-instrumentator is added, uncomment this job.
  # - job_name: 'inbridge-ai-service'
  #   static_configs:
  #     - targets: ['inbridge-ai:8000']
  #   metrics_path: '/metrics'
  #   scrape_interval: 15s

  # ── Prometheus self-scrape ──────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
