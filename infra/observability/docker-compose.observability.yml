version: '3.8'

# ── InBridge Observability Stack ──────────────────────────────────────────────
# Run alongside the main infra stack:
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/observability/docker-compose.observability.yml up
#
# Access:
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3001  (admin / inbridge_grafana)
# ─────────────────────────────────────────────────────────────────────────────

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: inbridge-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - inbridge_default
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: inbridge-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=inbridge_grafana
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - inbridge_default
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  inbridge_default:
    external: true
    name: infra_default
